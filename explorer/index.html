<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global OpenWrt Router Hardware Explorer</title>
  <meta name="description" content="Explore, compare, and verify OpenWrt-compatible router hardware, chipsets, and installation methods across global vendors.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --accent: #2f81f7;
      --accent-hover: #58a6ff;
      --success: #238636;
      --success-text: #3fb950;
      --warning: #9e6a03;
      --warning-text: #d29922;
      --danger-text: #f85149;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 1.5rem;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 2rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1.5rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-repo {
      font-size: 0.8rem;
      background: #21262d;
      border: 1px solid var(--card-border);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      color: var(--accent-hover);
      text-decoration: none;
      font-family: var(--font-mono);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 800px;
    }

    /* Controls Bar */
    .controls {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 900px) {
      .controls { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 550px) {
      .controls { grid-template-columns: 1fr; }
    }

    input, select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-bright);
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.2);
    }

    /* Comparison Tray */
    #comparison-tray {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      background: #1f242c;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 1rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .tray-items {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tray-pill {
      background: #21262d;
      border: 1px solid var(--card-border);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tray-remove {
      cursor: pointer;
      color: var(--danger-text);
      font-weight: bold;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #21262d; border: 1px solid var(--card-border); color: var(--text-bright); }
    .btn-secondary:hover { background: #30363d; }

    /* Results Grid */
    #device-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      border-color: #58a6ff;
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.15rem;
      color: var(--text-bright);
      font-weight: 600;
    }
    .card-vendor {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      text-transform: uppercase;
      font-family: var(--font-mono);
      white-space: nowrap;
    }
    .status-OFFICIALLY_SUPPORTED { background: rgba(35, 134, 54, 0.2); color: var(--success-text); border: 1px solid rgba(63, 185, 80, 0.3); }
    .status-COMMUNITY_VERIFIED { background: rgba(158, 106, 3, 0.2); color: var(--warning-text); border: 1px solid rgba(210, 153, 34, 0.3); }
    .status-PARTIALLY_VERIFIED { background: rgba(218, 54, 51, 0.2); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.3); }

    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem 0.8rem;
      font-size: 0.85rem;
      margin: 0.75rem 0;
      background: #0d1117;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid #21262d;
    }
    .spec-label { color: var(--text-muted); }
    .spec-val { color: var(--text-bright); font-family: var(--font-mono); font-size: 0.8rem; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid #21262d;
    }

    /* Modal / Drawer */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      max-width: 850px;
      margin: 2rem auto;
      padding: 2rem;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--text-bright); }

    /* Comparison Table View */
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.85rem;
    }
    .compare-table th, .compare-table td {
      border: 1px solid var(--card-border);
      padding: 0.6rem 0.8rem;
      text-align: left;
    }
    .compare-table th { background: #21262d; color: var(--text-bright); }

    .tag-pill {
      display: inline-block;
      background: #21262d;
      border: 1px solid var(--card-border);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.75rem;
      margin-right: 0.3rem;
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>🌐 Global OpenWrt Router Hardware Explorer</h1>
      <a href="../README.md" class="badge-repo">← Back to Guide</a>
    </div>
    <p class="subtitle">
      Comprehensive, evidence-based hardware database for OpenWrt-compatible routers, single-board gateways, and smart switches. Search by model, chipset, or flash type, view upstream firmware profiles, and compare platforms.
    </p>
  </header>

  <!-- Controls -->
  <section class="controls">
    <input type="text" id="search-input" placeholder="🔍 Search model, manufacturer, SoC (e.g. JIDU6101, MT7986, BPI-R4)..." autofocus>
    
    <select id="status-filter">
      <option value="ALL">All Support Statuses</option>
      <option value="OFFICIALLY_SUPPORTED">Officially Supported</option>
      <option value="COMMUNITY_VERIFIED">Community Verified</option>
      <option value="PARTIALLY_VERIFIED">Partially Verified</option>
    </select>

    <select id="wifi-filter">
      <option value="ALL">All Wi-Fi Generations</option>
      <option value="Wi-Fi 7">Wi-Fi 7 (802.11be)</option>
      <option value="Wi-Fi 6">Wi-Fi 6 (802.11ax)</option>
      <option value="Wi-Fi 5">Wi-Fi 5 (802.11ac)</option>
      <option value="Ethernet Only">Ethernet / Soft-Router Only</option>
    </select>

    <select id="soc-filter">
      <option value="ALL">All SoC Families</option>
      <option value="Filogic 830">MediaTek Filogic 830 (MT7986A)</option>
      <option value="Filogic 820">MediaTek Filogic 820 (MT7981B)</option>
      <option value="Filogic 880">MediaTek Filogic 880 (MT7988A)</option>
      <option value="MT7621">MediaTek MT7621</option>
      <option value="Qualcomm">Qualcomm (IPQ807x / IPQ60xx)</option>
      <option value="Rockchip">Rockchip (RK3568)</option>
      <option value="Broadcom">Broadcom (BCM4908)</option>
      <option value="Realtek">Realtek (RTL838x)</option>
      <option value="Intel/x86">Intel / x86_64</option>
    </select>
  </section>

  <!-- Active Comparison Tray -->
  <div id="comparison-tray">
    <div style="display:flex; align-items:center; gap: 1rem;">
      <strong style="color:var(--text-bright); font-size:0.9rem;">Comparing (<span id="compare-count">0</span>/3):</strong>
      <div class="tray-items" id="tray-pills"></div>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn btn-secondary" onclick="clearComparison()">Clear</button>
      <button class="btn" onclick="showComparisonModal()">Compare Side-by-Side</button>
    </div>
  </div>

  <!-- Device Grid -->
  <main id="device-grid"></main>

  <!-- Details / Comparison Modal -->
  <div id="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" id="modal-body" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModalDirect()">&times;</button>
      <div id="modal-inner"></div>
    </div>
  </div>

  <script>
    let allDevices = [];
    let compareList = [];

    async function loadData() {
      try {
        const res = await fetch('../data/index.json');
        if (!res.ok) throw new Error('Network response not ok');
        const data = await res.json();
        allDevices = data.devices || [];
        renderDevices(allDevices);
      } catch (err) {
        // Fallback for local file protocol where browser blocks local fetch
        const embedded = document.getElementById('embedded-data');
        if (embedded && embedded.textContent.trim()) {
          try {
            const data = JSON.parse(embedded.textContent);
            allDevices = data.devices || [];
            renderDevices(allDevices);
            return;
          } catch(e) {}
        }
        document.getElementById('device-grid').innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding: 3rem; background: var(--card-bg); border-radius: 8px;">
            <h3 style="color:var(--danger-text)">Failed to load device database</h3>
            <p style="color:var(--text-muted); margin-top:0.5rem;">Ensure <code>data/index.json</code> is generated and accessible.</p>
          </div>
        `;
      }
    }

    function renderDevices(devices) {
      const grid = document.getElementById('device-grid');
      if (devices.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding: 3rem; background: var(--card-bg); border-radius: 8px;">
            <h3>No matching router hardware found</h3>
            <p style="color:var(--text-muted); margin-top:0.5rem;">Try adjusting search keywords or clearing filter dropdowns.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = devices.map(d => {
        const wifiGen = d.wireless && d.wireless.length > 0 
          ? [...new Set(d.wireless.map(w => w.generation))].join(', ')
          : 'None (Ethernet Only)';

        const isComparing = compareList.includes(d.id);

        return `
          <article class="card">
            <div>
              <div class="card-header">
                <div>
                  <div class="card-vendor">${escapeHtml(d.manufacturer)}</div>
                  <h2 class="card-title">${escapeHtml(d.model)} <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted);">(${escapeHtml(d.hardware_revision)})</span></h2>
                </div>
                <span class="status-badge status-${d.openwrt.support_status}">${d.openwrt.support_status.replace(/_/g, ' ')}</span>
              </div>

              <div class="specs-grid">
                <div><span class="spec-label">SoC:</span></div>
                <div class="spec-val">${escapeHtml(d.soc.vendor)} ${escapeHtml(d.soc.model)}</div>
                
                <div><span class="spec-label">RAM / Flash:</span></div>
                <div class="spec-val">${d.ram_mb}MB / ${d.flash.capacity_mb}MB ${escapeHtml(d.flash.type)}</div>

                <div><span class="spec-label">Wi-Fi:</span></div>
                <div class="spec-val">${escapeHtml(wifiGen)}</div>

                <div><span class="spec-label">Target:</span></div>
                <div class="spec-val">${escapeHtml(d.openwrt.target)}</div>
              </div>
            </div>

            <div class="card-footer">
              <label style="font-size:0.8rem; color:var(--text-muted); display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
                <input type="checkbox" onchange="toggleCompare('${d.id}')" ${isComparing ? 'checked' : ''} style="width:auto;"> Compare
              </label>
              <button class="btn btn-secondary" onclick="viewDetails('${d.id}')">View Details →</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterDevices() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const statusFilter = document.getElementById('status-filter').value;
      const wifiFilter = document.getElementById('wifi-filter').value;
      const socFilter = document.getElementById('soc-filter').value;

      const filtered = allDevices.filter(d => {
        const matchesQuery = !query || 
          d.model.toLowerCase().includes(query) ||
          d.manufacturer.toLowerCase().includes(query) ||
          d.soc.model.toLowerCase().includes(query) ||
          d.soc.family.toLowerCase().includes(query) ||
          d.openwrt.target.toLowerCase().includes(query) ||
          (d.internal_board_name && d.internal_board_name.toLowerCase().includes(query));

        const matchesStatus = statusFilter === 'ALL' || d.openwrt.support_status === statusFilter;

        const hasWifi = d.wireless && d.wireless.length > 0;
        let matchesWifi = true;
        if (wifiFilter === 'Ethernet Only') {
          matchesWifi = !hasWifi;
        } else if (wifiFilter !== 'ALL') {
          matchesWifi = hasWifi && d.wireless.some(w => w.generation === wifiFilter);
        }

        let matchesSoc = true;
        if (socFilter !== 'ALL') {
          if (socFilter === 'Qualcomm') matchesSoc = d.soc.vendor === 'Qualcomm';
          else if (socFilter === 'Rockchip') matchesSoc = d.soc.vendor === 'Rockchip';
          else if (socFilter === 'Broadcom') matchesSoc = d.soc.vendor === 'Broadcom';
          else if (socFilter === 'Realtek') matchesSoc = d.soc.vendor === 'Realtek';
          else if (socFilter === 'Intel/x86') matchesSoc = d.architecture === 'x86_64';
          else matchesSoc = d.soc.family.includes(socFilter) || d.soc.model.includes(socFilter);
        }

        return matchesQuery && matchesStatus && matchesWifi && matchesSoc;
      });

      renderDevices(filtered);
    }

    document.getElementById('search-input').addEventListener('input', filterDevices);
    document.getElementById('status-filter').addEventListener('change', filterDevices);
    document.getElementById('wifi-filter').addEventListener('change', filterDevices);
    document.getElementById('soc-filter').addEventListener('change', filterDevices);

    function toggleCompare(id) {
      if (compareList.includes(id)) {
        compareList = compareList.filter(item => item !== id);
      } else {
        if (compareList.length >= 3) {
          alert('You can compare a maximum of 3 devices simultaneously.');
          filterDevices();
          return;
        }
        compareList.push(id);
      }
      updateComparisonTray();
    }

    function clearComparison() {
      compareList = [];
      updateComparisonTray();
      filterDevices();
    }

    function updateComparisonTray() {
      const tray = document.getElementById('comparison-tray');
      const pillsContainer = document.getElementById('tray-pills');
      const countEl = document.getElementById('compare-count');

      if (compareList.length === 0) {
        tray.style.display = 'none';
        return;
      }

      tray.style.display = 'flex';
      countEl.innerText = compareList.length;

      pillsContainer.innerHTML = compareList.map(id => {
        const d = allDevices.find(x => x.id === id);
        return `
          <div class="tray-pill">
            <span>${escapeHtml(d.manufacturer)} ${escapeHtml(d.model)}</span>
            <span class="tray-remove" onclick="toggleCompare('${id}')">&times;</span>
          </div>
        `;
      }).join('');
    }

    function showComparisonModal() {
      if (compareList.length < 2) {
        alert('Please select at least 2 devices to compare.');
        return;
      }

      const devices = compareList.map(id => allDevices.find(x => x.id === id));
      const modalInner = document.getElementById('modal-inner');

      modalInner.innerHTML = `
        <h2 style="color:var(--text-bright); margin-bottom:1rem;">Side-by-Side Hardware Comparison</h2>
        <table class="compare-table">
          <thead>
            <tr>
              <th>Feature</th>
              ${devices.map(d => `<th>${escapeHtml(d.manufacturer)} ${escapeHtml(d.model)} (${escapeHtml(d.hardware_revision)})</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Support Status</strong></td>
              ${devices.map(d => `<td><span class="status-badge status-${d.openwrt.support_status}">${d.openwrt.support_status.replace(/_/g, ' ')}</span></td>`).join('')}
            </tr>
            <tr>
              <td><strong>SoC / Silicon</strong></td>
              ${devices.map(d => `<td>${escapeHtml(d.soc.vendor)} ${escapeHtml(d.soc.model)} (${escapeHtml(d.soc.family)})</td>`).join('')}
            </tr>
            <tr>
              <td><strong>CPU Cores / Clock</strong></td>
              ${devices.map(d => `<td>${d.soc.cores} Cores @ ${d.soc.frequency_mhz} MHz (${escapeHtml(d.architecture)})</td>`).join('')}
            </tr>
            <tr>
              <td><strong>RAM Memory</strong></td>
              ${devices.map(d => `<td>${d.ram_mb} MB</td>`).join('')}
            </tr>
            <tr>
              <td><strong>Flash Storage</strong></td>
              ${devices.map(d => `<td>${d.flash.capacity_mb} MB (${escapeHtml(d.flash.type)})</td>`).join('')}
            </tr>
            <tr>
              <td><strong>OpenWrt Target</strong></td>
              ${devices.map(d => `<td><code>${escapeHtml(d.openwrt.target)}</code></td>`).join('')}
            </tr>
            <tr>
              <td><strong>Ethernet Switch / Ports</strong></td>
              ${devices.map(d => `<td>${d.ethernet.ports.map(p => `${p.name} (${p.speed_mbps}M)`).join(', ')}</td>`).join('')}
            </tr>
            <tr>
              <td><strong>Wi-Fi Capabilities</strong></td>
              ${devices.map(d => `<td>${(d.wireless || []).map(w => `${w.frequency_ghz}G: ${w.generation} ${w.spatial_streams}`).join('<br>') || 'None'}</td>`).join('')}
            </tr>
            <tr>
              <td><strong>Installation Method</strong></td>
              ${devices.map(d => `<td>${escapeHtml(d.installation.method)} (Risk: ${d.installation.risk})</td>`).join('')}
            </tr>
          </tbody>
        </table>
      `;

      document.getElementById('modal-overlay').style.display = 'block';
    }

    function viewDetails(id) {
      const d = allDevices.find(x => x.id === id);
      if (!d) return;

      const modalInner = document.getElementById('modal-inner');
      modalInner.innerHTML = `
        <div style="border-bottom: 1px solid var(--card-border); padding-bottom: 1rem; margin-bottom: 1rem;">
          <span class="card-vendor">${escapeHtml(d.manufacturer)}</span>
          <h2 style="color:var(--text-bright); font-size:1.6rem;">${escapeHtml(d.model)} <span style="font-size:1rem; color:var(--text-muted); font-weight:normal;">(Revision: ${escapeHtml(d.hardware_revision)})</span></h2>
          <div style="margin-top:0.5rem; display:flex; gap:0.5rem; align-items:center;">
            <span class="status-badge status-${d.openwrt.support_status}">${d.openwrt.support_status.replace(/_/g, ' ')}</span>
            ${d.openwrt.first_supported_version ? `<span class="tag-pill">First Supported: ${escapeHtml(d.openwrt.first_supported_version)}</span>` : ''}
            ${d.openwrt.device_tree_file ? `<span class="tag-pill">DTS: ${escapeHtml(d.openwrt.device_tree_file)}</span>` : ''}
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1.5rem; margin-bottom:1.5rem;">
          <div>
            <h3 style="color:var(--text-bright); font-size:1.05rem; margin-bottom:0.6rem;">Hardware Profile</h3>
            <ul style="list-style:none; font-size:0.9rem; line-height:1.7;">
              <li><strong>SoC:</strong> ${escapeHtml(d.soc.vendor)} ${escapeHtml(d.soc.model)} (${escapeHtml(d.soc.family)})</li>
              <li><strong>CPU:</strong> ${d.soc.cores} Cores @ ${d.soc.frequency_mhz} MHz (${escapeHtml(d.architecture)})</li>
              <li><strong>RAM:</strong> ${d.ram_mb} MB</li>
              <li><strong>Flash:</strong> ${d.flash.capacity_mb} MB ${escapeHtml(d.flash.type)}</li>
              <li><strong>Switch IC:</strong> ${escapeHtml(d.ethernet.switch_chip || 'Direct SoC MAC / None')}</li>
              <li><strong>Bootloader:</strong> ${escapeHtml(d.bootloader || 'Unknown')}</li>
              <li><strong>UART Serial:</strong> ${d.serial_uart && d.serial_uart.available ? `Available (${d.serial_uart.voltage || '3.3V'}, ${d.serial_uart.baudrate || 115200} baud)` : 'No / Unverified'}</li>
            </ul>
          </div>

          <div>
            <h3 style="color:var(--text-bright); font-size:1.05rem; margin-bottom:0.6rem;">Installation & Recovery</h3>
            <ul style="list-style:none; font-size:0.9rem; line-height:1.7;">
              <li><strong>Install Method:</strong> ${escapeHtml(d.installation.method)}</li>
              <li><strong>Flash Risk Level:</strong> <span style="color:${d.installation.risk === 'LOW' ? 'var(--success-text)' : d.installation.risk === 'MEDIUM' ? 'var(--warning-text)' : 'var(--danger-text)'}; font-weight:bold;">${escapeHtml(d.installation.risk)}</span></li>
              <li><strong>Factory Stage Required:</strong> ${d.installation.requires_factory_stage ? 'Yes (two-stage sysupgrade)' : 'No (direct sysupgrade)'}</li>
              <li><strong>Recovery Method:</strong> ${escapeHtml(d.recovery.method)} ${d.recovery.recovery_ip ? `(IP: ${d.recovery.recovery_ip})` : ''}</li>
              <li><strong>OpenWrt Target:</strong> <code>${escapeHtml(d.openwrt.target)}</code></li>
              <li><strong>Device Profile:</strong> <code>${escapeHtml(d.openwrt.profile)}</code></li>
            </ul>
          </div>
        </div>

        <div style="margin-bottom:1.5rem;">
          <h3 style="color:var(--text-bright); font-size:1.05rem; margin-bottom:0.6rem;">Ethernet Port Mapping</h3>
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            ${d.ethernet.ports.map(p => `
              <div style="background:#0d1117; border:1px solid var(--card-border); padding:0.4rem 0.8rem; border-radius:6px; font-size:0.85rem;">
                <strong>${escapeHtml(p.name)}</strong> (${p.speed_mbps} Mbps)
                ${p.dsa_port ? `<br><code style="font-size:0.75rem; color:var(--text-muted)">dsa: ${p.dsa_port}</code>` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        ${d.wireless && d.wireless.length > 0 ? `
          <div style="margin-bottom:1.5rem;">
            <h3 style="color:var(--text-bright); font-size:1.05rem; margin-bottom:0.6rem;">Wireless Subsystem</h3>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
              ${d.wireless.map(w => `
                <div style="background:#0d1117; border:1px solid var(--card-border); padding:0.4rem 0.8rem; border-radius:6px; font-size:0.85rem;">
                  <strong>${w.frequency_ghz} GHz</strong>: ${w.generation} (${w.spatial_streams})
                  <br><span style="font-size:0.75rem; color:var(--text-muted)">Chipset: ${escapeHtml(w.chipset)} | Max: ${w.max_phy_rate_mbps} Mbps (${w.channel_width_mhz} MHz)</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        ${d.openwrt.known_limitations && d.openwrt.known_limitations.length > 0 ? `
          <div style="margin-bottom:1.5rem; background:rgba(158, 106, 3, 0.15); border:1px solid rgba(210, 153, 34, 0.4); padding:0.8rem; border-radius:6px;">
            <strong style="color:var(--warning-text); font-size:0.9rem;">⚠️ Documented Limitations:</strong>
            <ul style="margin-left:1.2rem; font-size:0.85rem; margin-top:0.3rem;">
              ${d.openwrt.known_limitations.map(k => `<li>${escapeHtml(k)}</li>`).join('')}
            </ul>
          </div>
        ` : ''}

        <div>
          <h3 style="color:var(--text-bright); font-size:1.05rem; margin-bottom:0.6rem;">Primary & Upstream Citations</h3>
          <ul style="font-size:0.85rem; line-height:1.7;">
            ${(d.sources || []).map(s => `
              <li>
                <a href="${s.url}" target="_blank" rel="noopener" style="color:var(--accent-hover); text-decoration:none;">${escapeHtml(s.title)} ↗</a>
                <span style="color:var(--text-muted); font-size:0.75rem;">(${s.type}, verified ${s.date_accessed})</span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;

      document.getElementById('modal-overlay').style.display = 'block';
    }

    function closeModalDirect() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    function closeModal(e) {
      if (e.target.id === 'modal-overlay') {
        closeModalDirect();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    loadData();
  </script>
</body>
</html>
