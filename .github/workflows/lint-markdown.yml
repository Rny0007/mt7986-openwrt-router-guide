name: "Documentation & Markdown Quality"

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

jobs:
  check-links:
    name: "Check Relative File Links"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Check Local Markdown Links Integrity"
        run: |
          python -c '
          import os, re
          from pathlib import Path

          broken = []
          for md in Path(".").glob("**/*.md"):
              if ".git" in str(md): continue
              text = md.read_text(encoding="utf-8", errors="ignore")
              links = re.findall(r"\[.*?\]\((?!https?://|mailto:|#)(.*?)\)", text)
              for link in links:
                  target = link.split("#")[0]
                  if not target: continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      broken.append(f"{md}: Broken link to {target}")

          if broken:
              print("\n".join(broken))
              exit(1)
          else:
              print("All local markdown links verified successfully.")
          '
