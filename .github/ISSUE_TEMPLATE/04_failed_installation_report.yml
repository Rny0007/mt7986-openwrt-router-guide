name: "Failed Installation or Flashing Failure Report"
description: "Report an installation barrier, boot loop, or flashing failure to prevent other users from bricking hardware"
title: "[Flash Failure]: "
labels: ["flash-failure", "needs-investigation"]
body:
  - type: input
    id: router_model
    attributes:
      label: "Router Model & Exact Revision"
      placeholder: "e.g. Jio JIDU6201, Mercusys MR70X v2"
    validations:
      required: true
  - type: input
    id: firmware_image
    attributes:
      label: "Firmware Image Flashed (Filename & SHA256)"
    validations:
      required: true
  - type: textarea
    id: error_behavior
    attributes:
      label: "Observed Behavior & Failure Symptoms"
      description: "LED patterns, Ethernet link state, serial console boot loop log."
    validations:
      required: true
  - type: textarea
    id: recovery_attempted
    attributes:
      label: "Recovery Methods Attempted"
      description: "Did TFTP respond? Did failsafe mode trigger?"
